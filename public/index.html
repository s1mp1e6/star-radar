<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e16">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>开源雷达 · 日报存档</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
  <script>document.documentElement.dataset.theme = localStorage.getItem("sr-theme") || "dark";</script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo">🛰️</span>开源雷达</a>
    <nav class="nav">
      <a href="index.html" class="active">日报</a>
      <a href="favorites.html">收藏</a>
      <a href="leaderboard.html">排行</a>
      <a href="settings.html">设置</a>
    </nav>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" title="切换主题">☀️</button>
  </header>

  <main class="container">
    <div class="hero">
      <h1>开源雷达</h1>
      <p>每天自动发现 GitHub 上值得关注的新项目 · 收藏即追踪 · AI 深度详解</p>
      <div class="hero-stats">
        <div class="hero-stat"><div class="v" id="statDays">–</div><div class="k">天存档</div></div>
        <div class="hero-stat"><div class="v" id="statProjects">–</div><div class="k">个项目</div></div>
        <div class="hero-stat"><div class="v" id="statFavs">–</div><div class="k">个收藏</div></div>
      </div>
    </div>

    <div id="trendBox"></div>

    <div class="page-head" style="margin-top:26px">
      <h1>日报存档</h1>
      <span class="sub">每天北京时间 05:00 自动抓取 GitHub 新星榜前 25</span>
    </div>
    <div id="skelBox"></div>
    <div class="date-grid" id="grid"></div>
    <div id="statusBox"></div>
  </main>

  <div class="footer">开源雷达 StarRadar v0.1.3 · 数据来自 GitHub 官方 API · 0 元成本运行</div>

  <script type="module" src="assets/app.js"></script>
  <script type="module" src="assets/pages/index.js"></script>
</body>
</html>
